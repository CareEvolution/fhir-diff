name: Publish to NPM

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Deploy to NPM
        run: |
          npm config set @careevolution:registry=https://registry.npmjs.org/
          npm publish ./dist --access public